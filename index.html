<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learning Flip Cards</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 2rem; font-family: Arial, Helvetica, sans-serif; line-height: 1.5; background: #f5f7fa; }
h1 { text-align: center; margin-bottom: 0.5rem; }
.intro { text-align: center; margin-bottom: 2rem; color: #555; }
.cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.5rem; max-width: 1200px; margin: 0 auto; }
.flip-card { perspective: 1000px; }
.flip-card-button { width: 100%; height: 220px; border: none; background: transparent; cursor: pointer; padding: 0; text-align: left; }
.flip-card-button:focus-visible { outline: 3px solid #0066cc; outline-offset: 4px; }
.flip-card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; }
.flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
.card-face { position: absolute; inset: 0; border-radius: 12px; padding: 1.25rem; backface-visibility: hidden; box-shadow: 0 3px 12px rgba(0,0,0,0.12); display: flex; flex-direction: column; justify-content: center; }
.card-front { background: white; }
.card-back { background: #003366; color: white; transform: rotateY(180deg); }
.card-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; opacity: 0.7; margin-bottom: 0.75rem; }
.card-title { font-size: 1.25rem; font-weight: bold; margin-bottom: 0.75rem; }
.card-text { font-size: 0.95rem; }
.flip-hint { margin-top: auto; font-size: 0.8rem; opacity: 0.75; }
@media (max-width: 600px) {
  body { padding: 1rem; }
  .flip-card-button { height: 200px; }
}
</style>
</head>
<body>
<h1>Key Concepts</h1>
<p class="intro">Click a card to reveal the explanation.</p>
<div class="cards-grid">
<div class="flip-card"><button class="flip-card-button"><div class="flip-card-inner"><div class="card-face card-front"><div class="card-label">Concept</div><div class="card-title">Constructive Alignment</div><div class="card-text">How do learning activities support learning outcomes?</div><div class="flip-hint">Click to reveal</div></div><div class="card-face card-back"><div class="card-label">Explanation</div><div class="card-text">Learning outcomes, teaching activities and assessment should all align.</div></div></div></button></div>
<div class="flip-card"><button class="flip-card-button"><div class="flip-card-inner"><div class="card-face card-front"><div class="card-label">Concept</div><div class="card-title">Active Learning</div><div class="card-text">What helps students engage more deeply?</div><div class="flip-hint">Click to reveal</div></div><div class="card-face card-back"><div class="card-label">Explanation</div><div class="card-text">Students learn through discussion, practice and reflection.</div></div></div></button></div>
</div>
<script>
document.querySelectorAll('.flip-card-button').forEach(card => {
  card.addEventListener('click', () => {
    card.closest('.flip-card').classList.toggle('flipped');
  });
});
</script>
</body>
</html>
